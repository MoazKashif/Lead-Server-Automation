<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlowDrafts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c24"/>
      <stop offset="50%" stop-color="#080616"/>
      <stop offset="100%" stop-color="#03030a"/>
    </linearGradient>
    <linearGradient id="purpleViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glowDrafts" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgGlowDrafts)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Grid lines background -->
  <g opacity="0.12" stroke="#7F00FF" stroke-dasharray="4,8">
    <line x1="60" y1="60" x2="900" y2="60" />
    <line x1="60" y1="180" x2="900" y2="180" />
    <line x1="60" y1="300" x2="900" y2="300" />
    <line x1="60" y1="420" x2="900" y2="420" />
    <line x1="280" y1="40" x2="280" y2="440" />
    <line x1="560" y1="40" x2="560" y2="440" />
    <line x1="760" y1="40" x2="760" y2="440" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(60, 36)">
    <rect width="280" height="28" rx="14" fill="rgba(127, 0, 255, 0.12)" stroke="rgba(127, 0, 255, 0.4)"/>
    <circle cx="16" cy="14" r="5" fill="#7F00FF" filter="url(#glowDrafts)"/>
    <text x="32" y="18" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">INTENT PARSER &amp; DRAFT ENGINE</text>
  </g>
  <text x="900" y="54" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="12" text-anchor="end">HUMAN REVIEW SPEEDUP: 10X</text>

  <!-- Box 1: Inbound Message Ingest -->
  <g transform="translate(60, 100)">
    <rect width="200" height="280" rx="12" fill="rgba(24, 16, 48, 0.7)" stroke="rgba(127, 0, 255, 0.4)" stroke-width="1.5"/>
    <text x="20" y="32" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">1. INBOUND INTAKE</text>

    <g transform="translate(16, 55)">
      <rect width="168" height="40" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="20" r="6" fill="#ea4335"/>
      <text x="36" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Gmail Node / API</text>

      <rect y="48" width="168" height="40" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="68" r="6" fill="#0078d4"/>
      <text x="36" y="72" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Microsoft Outlook 365</text>

      <rect y="96" width="168" height="40" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="116" r="6" fill="#03363d"/>
      <text x="36" y="120" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Zendesk Support Tickets</text>

      <rect y="144" width="168" height="40" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="164" r="6" fill="#00c853"/>
      <text x="36" y="168" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Web Form Inquiries</text>
    </g>

    <text x="100" y="260" fill="#6b7280" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">Continuous Inbound Polling</text>
  </g>

  <!-- Connect 1 to 2 -->
  <g transform="translate(265, 240)">
    <path d="M 0 0 L 35 0" stroke="#7F00FF" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="35,-4 43,0 35,4" fill="#7F00FF"/>
  </g>

  <!-- Box 2: Gemini AI Semantic Classifier & Drafter -->
  <g transform="translate(305, 85)">
    <rect width="240" height="310" rx="12" fill="rgba(30, 18, 64, 0.9)" stroke="#7F00FF" stroke-width="2" filter="url(#glowDrafts)"/>
    <text x="20" y="32" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">2. COGNITIVE REASONING</text>
    <text x="20" y="52" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Gemini / Claude Semantic Parser</text>

    <g transform="translate(18, 70)">
      <!-- Step A -->
      <rect width="204" height="48" rx="6" fill="rgba(10, 10, 30, 0.8)" stroke="rgba(127,0,255,0.3)"/>
      <text x="12" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Urgency &amp; Sentiment Tagging</text>
      <text x="12" y="38" fill="#ef4444" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">HIGH URGENCY (Contract Renewal)</text>

      <!-- Step B -->
      <rect y="56" width="204" height="48" rx="6" fill="rgba(10, 10, 30, 0.8)" stroke="rgba(127,0,255,0.3)"/>
      <text x="12" y="78" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">RAG Context Retrieval</text>
      <text x="12" y="94" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="10">Match pricing docs &amp; SOP manuals</text>

      <!-- Step C -->
      <rect y="112" width="204" height="48" rx="6" fill="rgba(10, 10, 30, 0.8)" stroke="rgba(127,0,255,0.3)"/>
      <text x="12" y="134" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Structured Proposal Drafting</text>
      <text x="12" y="150" fill="#a855f7" font-family="'Space Grotesk', sans-serif" font-size="10">Generate polite, tailored response</text>
    </g>

    <rect x="25" y="278" width="190" height="20" rx="10" fill="rgba(127, 0, 255, 0.2)"/>
    <text x="120" y="292" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Output: JSON Schema Validated</text>
  </g>

  <!-- Connect 2 to 3 -->
  <g transform="translate(550, 240)">
    <path d="M 0 0 L 35 0" stroke="url(#purpleViolet)" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="35,-4 43,0 35,4" fill="#a855f7"/>
  </g>

  <!-- Box 3: Human-in-the-Loop Review Dashboard -->
  <g transform="translate(590, 100)">
    <rect width="180" height="280" rx="12" fill="rgba(24, 16, 48, 0.7)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5"/>
    <text x="18" y="32" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">3. HUMAN REVIEW</text>
    <text x="18" y="50" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Operator Approval</text>

    <g transform="translate(15, 65)">
      <rect width="150" height="28" rx="6" fill="rgba(0, 242, 254, 0.1)"/>
      <text x="75" y="18" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Ready in Inbox: 3s</text>

      <rect y="38" width="150" height="70" rx="6" fill="rgba(10, 10, 25, 0.8)" stroke="rgba(255,255,255,0.06)"/>
      <text x="10" y="55" fill="#f3f4f6" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">"Hi John, regarding</text>
      <text x="10" y="70" fill="#f3f4f6" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">your tier 3 plan, here</text>
      <text x="10" y="85" fill="#f3f4f6" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">is the direct link..."</text>
      <text x="10" y="100" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700">Confidence: 98.7%</text>

      <rect y="120" width="150" height="30" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
      <text x="75" y="139" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">1-Click Approve &amp; Send</text>
    </g>

    <text x="90" y="260" fill="#6b7280" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">Full Editorial Control</text>
  </g>

  <!-- Connect 3 to 4 -->
  <g transform="translate(775, 240)">
    <path d="M 0 0 L 30 0" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="30,-4 38,0 30,4" fill="#10b981"/>
  </g>

  <!-- Box 4: Dispatch -->
  <g transform="translate(810, 100)">
    <rect width="90" height="280" rx="12" fill="rgba(20, 20, 42, 0.7)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <text x="45" y="32" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">DISPATCH</text>

    <g transform="translate(15, 60)">
      <circle cx="30" cy="30" r="22" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5"/>
      <text x="30" y="35" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" text-anchor="middle">SENT</text>

      <text x="30" y="90" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Delivered</text>
      <text x="30" y="105" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">&lt; 30s</text>

      <text x="30" y="150" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">CRM Logged</text>
      <text x="30" y="165" fill="#00F2FE" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">100%</text>
    </g>

    <text x="45" y="260" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">CLOSED</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(60, 425)">
    <text x="0" y="15" fill="#6b7280" font-family="'Space Grotesk', sans-serif" font-size="11">INTELLIGENCE METRICS:</text>
    <circle cx="150" cy="11" r="4" fill="#a855f7"/>
    <text x="160" y="15" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">ZERO HALLUCINATION BOUNDS</text>
    <text x="420" y="15" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="11">AVG RESPONSE TIME: <tspan fill="#ffffff" font-weight="700">UNDER 2 MINUTES</tspan></text>
    <text x="710" y="15" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="11">ACCURACY RATING: <tspan fill="#ffffff" font-weight="700">99.1%</tspan></text>
  </g>
</svg>