    <g transform="translate(15, 55)">
      <rect width="150" height="38" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="19" r="6" fill="#f97316"/>
      <text x="36" y="23" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">HubSpot Contacts</text>

      <rect y="48" width="150" height="38" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="67" r="6" fill="#0284c7"/>
      <text x="36" y="71" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Salesforce CRM</text>

      <rect y="96" width="150" height="38" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="115" r="6" fill="#10b981"/>
      <text x="36" y="119" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Supabase &amp; Postgres</text>

      <rect y="144" width="150" height="38" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="163" r="6" fill="#ec4899"/>
      <text x="36" y="167" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Airtable Bases</text>
    </g>

    <text x="90" y="260" fill="#6b7280" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">Bi-Directional Webhooks</text>
  </g>

  <!-- Connect 3 to 4 -->
  <g transform="translate(725, 240)">
    <path d="M 0 0 L 35 0" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="35,-4 43,0 35,4" fill="#10b981"/>
  </g>

  <!-- Column 4: Alerting & Actions -->
  <g transform="translate(765, 100)">
    <rect width="145" height="280" rx="12" fill="rgba(16, 20, 42, 0.7)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
    <text x="18" y="32" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">4. ACTIONS</text>

    <g transform="translate(14, 55)">
      <rect width="117" height="42" rx="6" fill="rgba(16, 185, 129, 0.1)"/>
      <text x="58" y="24" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Slack Ping</text>
      <text x="58" y="36" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Immediate rep alert</text>

      <rect y="52" width="117" height="42" rx="6" fill="rgba(14, 165, 233, 0.1)"/>
      <text x="58" y="76" fill="#0ea5e9" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Email Notif</text>
      <text x="58" y="88" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Summary delivery</text>

      <rect y="104" width="117" height="42" rx="6" fill="rgba(127, 0, 255, 0.1)"/>
      <text x="58" y="128" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">SMS Dispatch</text>
      <text x="58" y="140" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Instant 2-way SMS</text>
    </g>

    <rect x="12" y="248" width="121" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="72" y="263" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ZERO LEAKAGE</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(60, 425)">
    <text x="0" y="15" fill="#6b7280" font-family="'Space Grotesk', sans-serif" font-size="11">SECURITY AUDIT:</text>
    <circle cx="125" cy="11" r="4" fill="#0082ff"/>
    <text x="135" y="15" fill="#0082ff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">AES-256 AT REST &amp; IN TRANSIT</text>
    <text x="390" y="15" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="11">RETRY BACKOFF: <tspan fill="#ffffff" font-weight="700">EXPONENTIAL JITTER</tspan></text>
    <text x="680" y="15" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="11">AVG SYNC TIME: <tspan fill="#ffffff" font-weight="700">182ms</tspan></text>
  </g>
</svg>