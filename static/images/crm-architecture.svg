<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlowCrm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d24"/>
      <stop offset="50%" stop-color="#070818"/>
      <stop offset="100%" stop-color="#03030a"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0082ff"/>
    </linearGradient>
    <filter id="glowCrm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgGlowCrm)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Grid lines background -->
  <g opacity="0.12" stroke="#0082ff" stroke-dasharray="4,8">
    <line x1="60" y1="60" x2="900" y2="60" />
    <line x1="60" y1="180" x2="900" y2="180" />
    <line x1="60" y1="300" x2="900" y2="300" />
    <line x1="60" y1="420" x2="900" y2="420" />
    <line x1="260" y1="40" x2="260" y2="440" />
    <line x1="500" y1="40" x2="500" y2="440" />
    <line x1="720" y1="40" x2="720" y2="440" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(60, 36)">
    <rect width="270" height="28" rx="14" fill="rgba(0, 130, 255, 0.12)" stroke="rgba(0, 130, 255, 0.4)"/>
    <circle cx="16" cy="14" r="5" fill="#0082ff" filter="url(#glowCrm)"/>
    <text x="32" y="18" fill="#0082ff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DATA HARMONIZATION ENGINE</text>
  </g>
  <text x="900" y="54" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="12" text-anchor="end">CONSISTENCY GUARANTEE: ACID &amp; EVENTUAL 0-LOSS</text>

  <!-- Column 1: Multi-Channel Ingestion -->
  <g transform="translate(60, 100)">
    <rect width="180" height="280" rx="12" fill="rgba(16, 20, 42, 0.7)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
    <text x="20" y="32" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">1. INGESTION CHANNELS</text>
    
    <g transform="translate(15, 55)">
      <rect width="150" height="38" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="19" r="6" fill="#0ea5e9"/>
      <text x="36" y="23" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Meta / Google Ads</text>

      <rect y="48" width="150" height="38" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="67" r="6" fill="#6366f1"/>
      <text x="36" y="71" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Inbound Webhooks</text>

      <rect y="96" width="150" height="38" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="115" r="6" fill="#10b981"/>
      <text x="36" y="119" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Voice Transcripts</text>

      <rect y="144" width="150" height="38" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="20" cy="163" r="6" fill="#f59e0b"/>
      <text x="36" y="167" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Lead Capture Forms</text>
    </g>

    <text x="90" y="260" fill="#6b7280" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">Asynchronous Event Stream</text>
  </g>

  <!-- Connect 1 to 2 -->
  <g transform="translate(245, 240)">
    <path d="M 0 0 L 35 0" stroke="#00F2FE" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="35,-4 43,0 35,4" fill="#00F2FE"/>
  </g>

  <!-- Column 2: Pipeline Rules & Normalizer Engine -->
  <g transform="translate(285, 90)">
    <rect width="210" height="300" rx="12" fill="rgba(20, 24, 60, 0.85)" stroke="#0082ff" stroke-width="2" filter="url(#glowCrm)"/>
    <text x="20" y="32" fill="#0082ff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">2. PIPELINE LOGIC CORE</text>
    <text x="20" y="52" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Normalization &amp; Scoring</text>

