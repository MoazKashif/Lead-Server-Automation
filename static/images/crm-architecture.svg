      <text x="12" y="34" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Email, Phone, E.164 formats</text>

      <rect y="50" width="174" height="42" rx="6" fill="rgba(10, 14, 35, 0.8)" stroke="rgba(0,130,255,0.3)"/>
      <text x="12" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">AI Scoring &amp; Urgency</text>
      <text x="12" y="84" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">High / Medium / Low / Spam</text>

      <rect y="100" width="174" height="42" rx="6" fill="rgba(10, 14, 35, 0.8)" stroke="rgba(0,130,255,0.3)"/>
      <text x="12" y="120" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Deduplication Check</text>
      <text x="12" y="134" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">UUID &amp; Cross-Table Matching</text>

      <rect y="150" width="174" height="42" rx="6" fill="rgba(10, 14, 35, 0.8)" stroke="rgba(0,130,255,0.3)"/>
      <text x="12" y="170" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Dynamic Stage Routing</text>
      <text x="12" y="184" fill="#00F2FE" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Assign Rep + Pipeline Column</text>
    </g>

    <rect x="25" y="270" width="160" height="20" rx="10" fill="rgba(0, 130, 255, 0.2)"/>
    <text x="105" y="284" fill="#60a5fa" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Deterministic &lt; 150ms</text>
