<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1026"/>
      <stop offset="50%" stop-color="#060814"/>
      <stop offset="100%" stop-color="#03030a"/>
    </linearGradient>
    <linearGradient id="cyanGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgEdge)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Title Badge -->
  <g transform="translate(60, 36)">
    <rect width="290" height="28" rx="14" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)"/>
    <circle cx="16" cy="14" r="5" fill="#10b981"/>
    <text x="32" y="18" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">BENCHMARK COMPARISON MATRIX</text>
  </g>
  <text x="900" y="54" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="12" text-anchor="end">FANTOM AI VS. LEGACY HUMAN OPERATIONS</text>

  <!-- Comparison Columns Header -->
  <g transform="translate(60, 90)">
    <!-- Metric category header -->
    <text x="15" y="25" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">OPERATIONAL METRIC</text>

    <!-- Legacy Operations Header -->
    <rect x="360" y="0" width="220" height="36" rx="8" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)"/>
    <text x="470" y="23" fill="#ef4444" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">LEGACY BPO / HUMAN</text>

    <!-- Fantom Autonomous Header -->
    <rect x="620" y="0" width="240" height="36" rx="8" fill="rgba(0, 242, 254, 0.15)" stroke="#00F2FE" stroke-width="1.5"/>
    <text x="740" y="23" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">FANTOM AUTONOMOUS AI</text>
  </g>

  <!-- Row 1: Inbound Call Latency -->
  <g transform="translate(60, 145)">
    <rect width="840" height="60" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="20" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Inbound Lead Response Time</text>
    <text x="20" y="46" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Time to first engagement after user calls or submits form</text>

    <text x="470" y="35" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">42 Minutes (avg)</text>
    <text x="740" y="35" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="middle">0 Seconds (Ring 1)</text>
  </g>

  <!-- Row 2: Concurrency Capacity -->
  <g transform="translate(60, 215)">
    <rect width="840" height="60" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="20" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Concurrent Call / Lead Capacity</text>
    <text x="20" y="46" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Simultaneous prospect inquiries handled without queues</text>

    <text x="470" y="35" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">1 per Operator</text>
    <text x="740" y="35" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Infinite Dynamic Lines</text>
  </g>

  <!-- Row 3: Operating Hours & Availability -->
  <g transform="translate(60, 285)">
    <rect width="840" height="60" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="20" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Weekly Operational Availability</text>
    <text x="20" y="46" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Coverage across weekends, holidays, and night hours</text>

    <text x="470" y="35" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">40 Hours / Week</text>
    <text x="740" y="35" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="middle">168 Hours (24/7/365)</text>
  </g>

  <!-- Row 4: Operational Cost & Error Rate -->
  <g transform="translate(60, 355)">
    <rect width="840" height="60" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="20" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Monthly Overhead &amp; Error Rate</text>
    <text x="20" y="46" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Direct salary, benefits, sick leave vs. guaranteed execution</text>

    <text x="470" y="35" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">$$$ + 12% Data Errors</text>
    <text x="740" y="35" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="middle">70%+ Cost Cut / 0% Leak</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(60, 435)">
    <circle cx="8" cy="8" r="4" fill="#00F2FE"/>
    <text x="20" y="12" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">OUTCOME:</text>
    <text x="90" y="12" fill="#f3f4f6" font-family="'Space Grotesk', sans-serif" font-size="11">Transform cost center into continuous revenue generation engine.</text>
  </g>
</svg>