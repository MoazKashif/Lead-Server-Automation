<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlowWeb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1228"/>
      <stop offset="50%" stop-color="#050818"/>
      <stop offset="100%" stop-color="#03030a"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
    <filter id="glowWeb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgGlowWeb)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Grid lines background -->
  <g opacity="0.12" stroke="#00F2FE" stroke-dasharray="4,8">
    <line x1="60" y1="60" x2="900" y2="60" />
    <line x1="60" y1="180" x2="900" y2="180" />
    <line x1="60" y1="300" x2="900" y2="300" />
    <line x1="60" y1="420" x2="900" y2="420" />
    <line x1="280" y1="40" x2="280" y2="440" />
    <line x1="580" y1="40" x2="580" y2="440" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(60, 36)">
    <rect width="300" height="28" rx="14" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)"/>
    <circle cx="16" cy="14" r="5" fill="#00F2FE" filter="url(#glowWeb)"/>
    <text x="32" y="18" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">FULL-STACK WEBGL &amp; AI STACK</text>
  </g>
  <text x="900" y="54" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="12" text-anchor="end">LIGHTHOUSE PERFORMANCE: 100/100</text>

  <!-- Layer 1: Client Visual System -->
  <g transform="translate(60, 100)">
    <rect width="250" height="280" rx="12" fill="rgba(16, 24, 52, 0.75)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5"/>
    <text x="20" y="32" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">1. PRESENTATION LAYER</text>
    <text x="20" y="50" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">60FPS WebGL &amp; GSAP</text>

    <g transform="translate(18, 65)">
      <rect width="214" height="42" rx="6" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.2)"/>
      <text x="14" y="20" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Three.js Particle Meshes</text>
      <text x="14" y="34" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Real-time GPU accelerated shaders</text>

      <rect y="50" width="214" height="42" rx="6" fill="rgba(127, 0, 255, 0.08)" stroke="rgba(127, 0, 255, 0.2)"/>
      <text x="14" y="70" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">GSAP ScrollTrigger</text>
      <text x="14" y="84" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Kinetic typography &amp; parallax</text>

      <rect y="100" width="214" height="42" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="14" y="120" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Responsive Glassmorphism</text>
      <text x="14" y="134" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Tailwind CSS + backdrop-filter</text>
    </g>

    <rect x="25" y="240" width="200" height="24" rx="12" fill="rgba(0, 242, 254, 0.1)"/>
    <text x="125" y="256" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Sub-80ms First Contentful Paint</text>
  </g>

  <!-- Connect 1 to 2 -->
  <g transform="translate(315, 240)">
    <path d="M 0 0 L 40 0" stroke="url(#cyanNeon)" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="40,-4 48,0 40,4" fill="#7F00FF"/>
  </g>

  <!-- Layer 2: Edge Delivery & Async Backend -->
  <g transform="translate(360, 85)">
    <rect width="250" height="310" rx="12" fill="rgba(24, 20, 56, 0.9)" stroke="#7F00FF" stroke-width="2" filter="url(#glowWeb)"/>
    <text x="20" y="32" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">2. APPLICATION SERVER</text>
    <text x="20" y="50" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">FastAPI &amp; Cloudflare Global Edge</text>

    <g transform="translate(18, 65)">
      <rect width="214" height="46" rx="6" fill="rgba(10, 10, 30, 0.8)" stroke="rgba(127,0,255,0.3)"/>
      <text x="14" y="20" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">FastAPI Asynchronous Engine</text>
      <text x="14" y="36" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="10">Microsecond route handlers &amp; SSE</text>

      <rect y="54" width="214" height="46" rx="6" fill="rgba(10, 10, 30, 0.8)" stroke="rgba(127,0,255,0.3)"/>
      <text x="14" y="74" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Security &amp; Auth Guards</text>
      <text x="14" y="90" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="10">2FA, bcrypt, CSP, nosniff headers</text>

      <rect y="108" width="214" height="46" rx="6" fill="rgba(10, 10, 30, 0.8)" stroke="rgba(127,0,255,0.3)"/>
      <text x="14" y="128" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Cloudflare Edge CDN</text>
      <text x="14" y="144" fill="#a855f7" font-family="'Space Grotesk', sans-serif" font-size="10">Brotli compression &amp; 300+ PoPs</text>
    </g>

    <rect x="25" y="270" width="200" height="24" rx="12" fill="rgba(127, 0, 255, 0.2)"/>
    <text x="125" y="286" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Zero Overhead Microservices</text>
  </g>

  <!-- Connect 2 to 3 -->
  <g transform="translate(615, 240)">
    <path d="M 0 0 L 40 0" stroke="#00F2FE" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="40,-4 48,0 40,4" fill="#00F2FE"/>
  </g>

  <!-- Layer 3: AI Inference & Telemetry -->
  <g transform="translate(660, 100)">
    <rect width="240" height="280" rx="12" fill="rgba(16, 24, 52, 0.75)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <text x="20" y="32" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">3. MODEL &amp; DATA FABRIC</text>
    <text x="20" y="50" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Real-Time Connectivity</text>

    <g transform="translate(18, 65)">
      <rect width="204" height="42" rx="6" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.2)"/>
      <text x="14" y="20" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Native Gemini Models</text>
      <text x="14" y="34" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Direct SDK inference bindings</text>

      <rect y="50" width="204" height="42" rx="6" fill="rgba(14, 165, 233, 0.08)" stroke="rgba(14, 165, 233, 0.2)"/>
      <text x="14" y="70" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Supabase &amp; Redis</text>
      <text x="14" y="84" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Real-time DB subscriptions</text>

      <rect y="100" width="204" height="42" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.2)"/>
      <text x="14" y="120" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Telemetry &amp; Audit Logs</text>
      <text x="14" y="134" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Real-time error tracing &amp; alerts</text>
    </g>

    <rect x="25" y="240" width="190" height="24" rx="12" fill="rgba(16, 185, 129, 0.1)"/>
    <text x="120" y="256" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Scalable to Millions of Hits</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(60, 425)">
    <text x="0" y="15" fill="#6b7280" font-family="'Space Grotesk', sans-serif" font-size="11">PERFORMANCE AUDIT:</text>
    <circle cx="150" cy="11" r="4" fill="#00F2FE"/>
    <text x="160" y="15" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">LARGEST CONTENTFUL PAINT &lt; 0.6s</text>
    <text x="450" y="15" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="11">CUMULATIVE LAYOUT SHIFT: <tspan fill="#ffffff" font-weight="700">0.00</tspan></text>
    <text x="730" y="15" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="11">FIRST INPUT DELAY: <tspan fill="#ffffff" font-weight="700">2ms</tspan></text>
  </g>
</svg>