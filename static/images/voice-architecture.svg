<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c24"/>
      <stop offset="50%" stop-color="#070716"/>
      <stop offset="100%" stop-color="#03030a"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgGlow)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Grid lines background -->
  <g opacity="0.12" stroke="#00F2FE" stroke-dasharray="4,8">
    <line x1="60" y1="60" x2="900" y2="60" />
    <line x1="60" y1="180" x2="900" y2="180" />
    <line x1="60" y1="300" x2="900" y2="300" />
    <line x1="60" y1="420" x2="900" y2="420" />
    <line x1="180" y1="40" x2="180" y2="440" />
    <line x1="380" y1="40" x2="380" y2="440" />
    <line x1="580" y1="40" x2="580" y2="440" />
    <line x1="780" y1="40" x2="780" y2="440" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(60, 36)">
    <rect width="260" height="28" rx="14" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)"/>
    <circle cx="16" cy="14" r="5" fill="#00F2FE" filter="url(#glow)"/>
    <text x="32" y="18" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TELEPHONY &amp; INFERENCE PIPELINE</text>
  </g>
  <text x="760" y="54" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="12" text-anchor="end">LATENCY TARGET: &lt; 280ms ROUNDTRIP</text>

  <!-- STEP 1: Inbound Call -->
  <g transform="translate(60, 110)">
    <rect width="180" height="260" rx="12" fill="rgba(20, 20, 42, 0.7)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5"/>
    <circle cx="90" cy="50" r="28" fill="rgba(0, 242, 254, 0.12)" stroke="#00F2FE" stroke-width="1.5"/>
    <!-- Phone icon -->
    <path d="M82 40 C 82 38, 98 38, 98 40 L 98 46 C 98 48, 94 50, 90 52 C 86 50, 82 48, 82 46 Z M82 54 C 85 58, 95 58, 98 54" fill="none" stroke="#00F2FE" stroke-width="2" stroke-linecap="round"/>
    <text x="90" y="110" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Inbound SIP / PSTN</text>
    <text x="90" y="132" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Twilio, Vonage, Vapi</text>
    
    <!-- Waveform visual -->
    <g transform="translate(30, 160)" stroke="#00F2FE" stroke-width="2" stroke-linecap="round">
      <line x1="10" y1="20" x2="10" y2="35"/>
      <line x1="25" y1="10" x2="25" y2="45"/>
      <line x1="40" y1="5" x2="40" y2="50"/>
      <line x1="55" y1="15" x2="55" y2="40"/>
      <line x1="70" y1="0" x2="70" y2="55"/>
      <line x1="85" y1="10" x2="85" y2="45"/>
      <line x1="100" y1="22" x2="100" y2="33"/>
      <line x1="115" y1="12" x2="115" y2="43"/>
    </g>

    <rect x="25" y="225" width="130" height="24" rx="12" fill="rgba(0, 242, 254, 0.1)"/>
    <text x="90" y="241" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Streaming Audio</text>
  </g>

  <!-- Flow Arrow 1 -->
  <g transform="translate(245, 230)">
    <path d="M 0 0 L 40 0" stroke="url(#cyanPurple)" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="40,-4 48,0 40,4" fill="#7F00FF"/>
    <text x="24" y="-8" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="10" text-anchor="middle">&lt; 40ms</text>
  </g>

  <!-- STEP 2: STT & Neural Engine -->
  <g transform="translate(295, 90)">
    <rect width="210" height="300" rx="12" fill="rgba(24, 18, 52, 0.8)" stroke="#7F00FF" stroke-width="2" filter="url(#glow)"/>
    <circle cx="105" cy="48" r="28" fill="rgba(127, 0, 255, 0.2)" stroke="#7F00FF" stroke-width="1.5"/>
    <text x="105" y="54" fill="#7F00FF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" text-anchor="middle">AI</text>
    <text x="105" y="105" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Neural Voice Core</text>
    <text x="105" y="125" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Whisper / Deepgram STT</text>

    <!-- Specs breakdown -->
    <g transform="translate(20, 145)">
      <rect width="170" height="32" rx="6" fill="rgba(10, 10, 25, 0.6)" stroke="rgba(255,255,255,0.06)"/>
      <text x="12" y="20" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Intent Extraction</text>
      <text x="158" y="20" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="end">99.4%</text>

      <rect y="40" width="170" height="32" rx="6" fill="rgba(10, 10, 25, 0.6)" stroke="rgba(255,255,255,0.06)"/>
      <text x="12" y="60" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Brand Persona</text>
      <text x="158" y="60" fill="#7F00FF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="end">Active</text>

      <rect y="80" width="170" height="32" rx="6" fill="rgba(10, 10, 25, 0.6)" stroke="rgba(255,255,255,0.06)"/>
      <text x="12" y="100" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Interruption Handling</text>
      <text x="158" y="100" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="end">&lt; 80ms</text>
    </g>

    <rect x="25" y="268" width="160" height="20" rx="10" fill="rgba(127, 0, 255, 0.2)"/>
    <text x="105" y="282" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Contextual LLM Reasoning</text>
  </g>

  <!-- Flow Arrow 2 -->
  <g transform="translate(510, 230)">
    <path d="M 0 0 L 35 0" stroke="url(#purplePink)" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="35,-4 43,0 35,4" fill="#ec4899"/>
    <text x="20" y="-8" fill="#7F00FF" font-family="'Space Grotesk', sans-serif" font-size="10" text-anchor="middle">&lt; 90ms</text>
  </g>

  <!-- STEP 3: Live Integration & Booking -->
  <g transform="translate(555, 110)">
    <rect width="170" height="260" rx="12" fill="rgba(20, 20, 42, 0.7)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5"/>
    <circle cx="85" cy="50" r="28" fill="rgba(236, 72, 153, 0.12)" stroke="#ec4899" stroke-width="1.5"/>
    <text x="85" y="56" fill="#ec4899" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" text-anchor="middle">SYNC</text>
    <text x="85" y="110" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" text-anchor="middle">CRM &amp; Calendar</text>
    <text x="85" y="130" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Slot Verification</text>

    <g transform="translate(18, 150)">
      <rect width="134" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
      <text x="10" y="17" fill="#f3f4f6" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Google Calendar</text>
      
      <rect y="32" width="134" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
      <text x="10" y="49" fill="#f3f4f6" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Outlook 365</text>

      <rect y="64" width="134" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
      <text x="10" y="81" fill="#f3f4f6" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">HubSpot Contacts</text>
    </g>

    <rect x="20" y="225" width="130" height="24" rx="12" fill="rgba(236, 72, 153, 0.1)"/>
    <text x="85" y="241" fill="#ec4899" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Zero Double-Booking</text>
  </g>

  <!-- Flow Arrow 3 -->
  <g transform="translate(730, 230)">
    <path d="M 0 0 L 35 0" stroke="#00F2FE" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="35,-4 43,0 35,4" fill="#00F2FE"/>
    <text x="20" y="-8" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="10" text-anchor="middle">&lt; 70ms</text>
  </g>

  <!-- STEP 4: Audio Synthesis & Dispatch -->
  <g transform="translate(770, 110)">
    <rect width="150" height="260" rx="12" fill="rgba(20, 20, 42, 0.7)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5"/>
    <circle cx="75" cy="50" r="28" fill="rgba(0, 242, 254, 0.12)" stroke="#00F2FE" stroke-width="1.5"/>
    <text x="75" y="55" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" text-anchor="middle">TTS</text>
    <text x="75" y="110" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Neural Audio</text>
    <text x="75" y="130" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">ElevenLabs / Cartesia</text>

    <g transform="translate(20, 155)">
      <rect width="110" height="20" rx="4" fill="rgba(0, 242, 254, 0.1)"/>
      <text x="55" y="14" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Human Natural</text>
      
      <rect y="28" width="110" height="20" rx="4" fill="rgba(16, 185, 129, 0.1)"/>
      <text x="55" y="42" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">100% Cloned Fidelity</text>

      <rect y="56" width="110" height="20" rx="4" fill="rgba(127, 0, 255, 0.1)"/>
      <text x="55" y="70" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Auto-Transcribed</text>
    </g>

    <rect x="15" y="225" width="120" height="24" rx="12" fill="rgba(0, 242, 254, 0.1)"/>
    <text x="75" y="241" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Call Dispatched</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(60, 425)">
    <text x="0" y="15" fill="#6b7280" font-family="'Space Grotesk', sans-serif" font-size="11">INFRASTRUCTURE STATUS:</text>
    <circle cx="160" cy="11" r="4" fill="#10b981"/>
    <text x="170" y="15" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">ACTIVE &amp; MONITORING</text>
    <text x="360" y="15" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="11">PARALLEL SESSIONS: <tspan fill="#ffffff" font-weight="700">UNLIMITED</tspan></text>
    <text x="600" y="15" fill="#9ca3af" font-family="'Space Grotesk', sans-serif" font-size="11">CODECS: <tspan fill="#ffffff" font-weight="700">G.711 / Opus 48kHz</tspan></text>
  </g>
</svg>