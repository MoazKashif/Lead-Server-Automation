<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
    <linearGradient id="fg2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
  </defs>
  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="90" stroke="url(#fg)" stroke-width="1.5" opacity="0.3" fill="none"/>
  <!-- F Letter Shape -->
  <g filter="url(#glow)">
    <!-- Vertical stem -->
    <rect x="70" y="40" width="16" height="120" rx="4" fill="url(#fg)" opacity="0.9"/>
    <!-- Top horizontal bar -->
    <rect x="86" y="40" width="60" height="14" rx="4" fill="url(#fg)"/>
    <!-- Middle horizontal bar -->
    <rect x="86" y="88" width="48" height="14" rx="4" fill="url(#fg2)" opacity="0.85"/>
  </g>
  <!-- Decorative data dots -->
  <circle cx="150" cy="168" r="3" fill="#00F2FE" opacity="0.6"/>
  <circle cx="160" cy="158" r="2" fill="#7F00FF" opacity="0.5"/>
  <circle cx="155" cy="178" r="2" fill="#00F2FE" opacity="0.4"/>
  <!-- Small orbiting particles -->
  <circle cx="50" cy="50" r="2" fill="#00F2FE" opacity="0.4"/>
  <circle cx="155" cy="45" r="1.5" fill="#7F00FF" opacity="0.5"/>
  <circle cx="160" cy="140" r="2" fill="#00F2FE" opacity="0.35"/>
</svg>